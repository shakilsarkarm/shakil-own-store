<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shakil Store Admin</title><style>body{font-family:Arial;background:#f5f7f4;color:#17231d;max-width:1000px;margin:auto;padding:18px}input,button,textarea{font:inherit;padding:11px;border:1px solid #dce4dc;border-radius:8px}button{cursor:pointer;background:#176b50;color:white;border:0;font-weight:bold}.panel{background:white;border:1px solid #e1e8e1;border-radius:12px;padding:16px;margin:15px 0}.row{display:flex;gap:8px;flex-wrap:wrap}.row input{flex:1;min-width:180px}.order{border-top:1px solid #ddd;padding:12px 0;overflow-wrap:anywhere}.muted{color:#68746c;font-size:13px}.danger{background:#9c3030}</style></head><body><h1>Shakil Store — Admin</h1><p class="muted">Admin access requires a Supabase Auth user whose UUID is in the admin_users table. Never share this page as a security mechanism by itself.</p><div class="panel" id="login"><h2>Admin sign in</h2><div class="row"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"></div><p><button onclick="signIn()">Sign in</button> <button onclick="signOut()">Sign out</button></p><p id="loginMsg" class="muted"></p></div><div class="panel"><h2>Orders</h2><button onclick="loadOrders()">Refresh orders</button><p id="msg" class="muted"></p><div id="orders"></div></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);let session=null;
async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});document.getElementById('loginMsg').textContent=error?error.message:'Signed in.';session=data?.session;if(session)loadOrders();}
async function signOut(){await sb.auth.signOut();session=null;document.getElementById('orders').innerHTML='';document.getElementById('loginMsg').textContent='Signed out.';}
async function loadOrders(){document.getElementById('msg').textContent='Loading…';const {data,error}=await sb.functions.invoke('admin-order-action',{body:{action:'list'}});if(error){document.getElementById('msg').textContent='Could not load orders: '+error.message;return;}const orders=data.orders||[];document.getElementById('msg').textContent=orders.length+' recent orders';document.getElementById('orders').innerHTML=orders.map(o=>`<div class="order"><strong>${esc(o.order_ref)}</strong> — ${esc(o.status)}<br>${esc(o.customer_name)} · ${esc(o.phone)}<br>${esc(o.address)}<br>Payment: ${esc(o.payment_method)} · ${esc(o.payment_status)} · Total ৳${Number(o.total).toLocaleString('en-BD')}<br>Transaction ID: ${esc(o.transaction_id||'Not provided')}<br><small>${esc(JSON.stringify(o.items))}</small><p><button onclick="act('${o.id}','verify')">Verify payment</button> <button class="danger" onclick="act('${o.id}','reject')">Reject payment</button> <button onclick="act('${o.id}','dispatched')">Mark dispatched</button> <button onclick="act('${o.id}','delivered')">Mark delivered</button></p></div>`).join('')||'No orders yet.';}
async function act(id,action){const {data,error}=await sb.functions.invoke('admin-order-action',{body:{action,order_id:id}});document.getElementById('msg').textContent=error?error.message:(data?.message||'Updated');loadOrders();}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
</script></body></html>
