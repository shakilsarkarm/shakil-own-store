<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shakil Store Admin</title><style>:root{--green:#126b50;--ink:#17231d;--line:#e0e9e1}body{font-family:Arial,sans-serif;background:#f5f8f5;color:var(--ink);max-width:1100px;margin:auto;padding:18px}input,button,textarea,select{font:inherit;padding:11px;border:1px solid #dce4dc;border-radius:9px}button{cursor:pointer;background:var(--green);color:white;border:0;font-weight:bold}.soft{background:#e8f2eb;color:var(--green)}.panel{background:white;border:1px solid var(--line);border-radius:15px;padding:18px;margin:15px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row input{flex:1;min-width:170px}.muted{color:#68746c;font-size:13px;line-height:1.6}.danger{background:#9c3030}.order,.product{border-top:1px solid #e5e9e5;padding:14px 0;overflow-wrap:anywhere}.product{display:grid;grid-template-columns:minmax(180px,1fr) 130px 110px;gap:10px;align-items:center}.stock{width:100%;box-sizing:border-box}@media(max-width:600px){.product{grid-template-columns:1fr 100px}.product .save{grid-column:1/-1}}</style></head><body><h1>Shakil Store — Admin</h1><p class="muted">Sign in with the Supabase Auth user whose UUID is registered in <code>admin_users</code>. Never expose the service-role key.</p><section class="panel" id="login"><h2>Admin sign in</h2><div class="row"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"></div><p><button onclick="signIn()">Sign in</button> <button class="soft" onclick="signOut()">Sign out</button></p><p id="loginMsg" class="muted"></p></section><section class="panel"><h2>Product stock control</h2><p class="muted">Change the available quantity and click Save. Stock updates are restricted by Supabase admin access rules.</p><button onclick="loadProducts()">Refresh products</button><p id="productMsg" class="muted"></p><div id="products"></div></section><section class="panel"><h2>Orders</h2><button onclick="loadOrders()">Refresh orders</button><p id="msg" class="muted"></p><div id="orders"></div></section><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);let session=null;function el(id){return document.getElementById(id);}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:el('email').value,password:el('password').value});el('loginMsg').textContent=error?error.message:'Signed in.';session=data?.session;if(session){loadOrders();loadProducts();}}async function signOut(){await sb.auth.signOut();session=null;el('orders').innerHTML='';el('products').innerHTML='';el('loginMsg').textContent='Signed out.';}
async function loadProducts(){el('productMsg').textContent='Loading products…';const {data,error}=await sb.from('products').select('id,name,price,active,stock_quantity').order('id',{ascending:false});if(error){el('productMsg').textContent='Could not load products: '+error.message+' (run upgrade-v4.sql first)';return;}el('productMsg').textContent=data.length+' products';el('products').innerHTML=data.map(p=>`<div class="product"><div><strong>${esc(p.name)}</strong><br><span class="muted">ID ${p.id} · ৳${Number(p.price).toLocaleString('en-BD')} · ${p.active?'Active':'Hidden'}</span></div><label>Stock quantity<input class="stock" type="number" min="0" max="1000000" id="stock-${p.id}" value="${Number(p.stock_quantity||0)}"></label><button class="save" onclick="saveStock(${p.id})">Save stock</button></div>`).join('')||'No products yet.';}
async function saveStock(id){const n=Number(el('stock-'+id).value);if(!Number.isSafeInteger(n)||n<0||n>1000000){el('productMsg').textContent='Enter a whole quantity from 0 to 1,000,000.';return;}el('productMsg').textContent='Saving stock…';const {error}=await sb.from('products').update({stock_quantity:n}).eq('id',id);el('productMsg').textContent=error?'Could not save stock: '+error.message:'Stock updated.';if(!error)loadProducts();}
async function loadOrders(){el('msg').textContent='Loading…';const {data,error}=await sb.functions.invoke('admin-order-action',{body:{action:'list'}});if(error){el('msg').textContent='Could not load orders: '+error.message;return;}const orders=data.orders||[];el('msg').textContent=orders.length+' recent orders';el('orders').innerHTML=orders.map(o=>`<div class="order"><strong>${esc(o.order_ref)}</strong> — ${esc(o.status)}<br>${esc(o.customer_name)} · ${esc(o.phone)}<br>${esc(o.address)}<br>${o.note?'Note: '+esc(o.note)+'<br>':''}Payment: ${esc(o.payment_method)} · ${esc(o.payment_status)} · Total ৳${Number(o.total).toLocaleString('en-BD')}<br>Delivery: ৳${Number(o.delivery_charge||0).toLocaleString('en-BD')} · Receipt email: ${esc(o.email_status||'unknown')}<br>Transaction ID: ${esc(o.transaction_id||'Not provided')}<br><small>${esc(JSON.stringify(o.items))}</small><p><button onclick="act('${o.id}','verify')">Verify payment</button> <button class="danger" onclick="act('${o.id}','reject')">Reject payment</button> <button onclick="act('${o.id}','dispatched')">Mark dispatched</button> <button onclick="act('${o.id}','delivered')">Mark delivered</button></p></div>`).join('')||'No orders yet.';}
async function act(id,action){const {data,error}=await sb.functions.invoke('admin-order-action',{body:{action,order_id:id}});el('msg').textContent=error?error.message:(data?.message||'Updated');loadOrders();}sb.auth.onAuthStateChange((_event,s)=>{session=s;});
</script></body></html>
