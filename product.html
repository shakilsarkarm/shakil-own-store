<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product details — Shakil Store</title><style>
:root{--green:#126b50;--ink:#17231d;--muted:#68756d;--bg:#f5f8f5;--line:#e0e9e1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:12px 16px;font-weight:750}.primary{background:var(--green);color:white}.soft{background:#e8f2eb;color:var(--green)}a{color:var(--green)}header{background:#fff;border-bottom:1px solid var(--line)}.nav,main,footer{max-width:1080px;margin:auto;padding:16px}.nav{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:23px;font-weight:900;color:var(--green);text-decoration:none}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:20px;margin:18px 0}.product{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}.photo{width:100%;max-height:540px;aspect-ratio:1;object-fit:contain;background:#eef3ee;border-radius:15px}.price{font-size:28px;font-weight:900;color:var(--green)}.muted{color:var(--muted);line-height:1.6;font-size:14px}.field{width:100%;padding:12px;border:1px solid #d8e3da;border-radius:10px;background:white}.form{display:grid;gap:10px;max-width:650px}.review{padding:14px 0;border-bottom:1px solid var(--line)}.stars{color:#a66b00;font-size:18px}.hidden{display:none!important}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--green)}footer{color:var(--muted);font-size:13px}@media(max-width:680px){.product{grid-template-columns:1fr}.photo{max-height:360px}.nav{flex-wrap:wrap}}
</style></head><body><header><div class="nav"><a class="logo" href="index.html">Shakil Store</a><div><a href="index.html#products">All products</a> · <a href="profile.html">My account</a> · <a href="index.html#checkout">Cart</a></div></div></header><main><p><a href="index.html#products">← Back to products</a></p><section id="productArea" class="panel">Loading product details…</section><section class="panel"><span class="eyebrow">REAL CUSTOMER FEEDBACK</span><h2>Product details & reviews</h2><p id="reviewSummary" class="muted">Loading reviews…</p><div id="reviews"></div></section><section class="panel"><h2>Write a review</h2><p class="muted">Sign in with a confirmed email to share your experience.</p><form id="reviewForm" class="form"><label for="rating">Your rating</label><select class="field" id="rating" required><option value="5">★★★★★ — Excellent (5)</option><option value="4">★★★★☆ — Very good (4)</option><option value="3">★★★☆☆ — Good (3)</option><option value="2">★★☆☆☆ — Fair (2)</option><option value="1">★☆☆☆☆ — Poor (1)</option></select><label for="reviewText">Your review</label><textarea class="field" id="reviewText" required minlength="3" maxlength="1500" rows="5" placeholder="What did you think of this product?"></textarea><button class="primary" type="submit">Submit review</button><p id="reviewMessage" class="muted" role="status"></p></form></section></main><footer>© <span id="year"></span> Shakil Store</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey),el=id=>document.getElementById(id),money=n=>'৳'+Number(n||0).toLocaleString('en-BD'),params=new URLSearchParams(location.search),productId=Number(params.get('id'));let product=null,currentUser=null,myReview=null;function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadProduct(){if(!Number.isSafeInteger(productId)||productId<1){el('productArea').textContent='Invalid product link.';return;}const {data,error}=await sb.from('products').select('id,name,category,description,price,image_url,stock_quantity').eq('id',productId).eq('active',true).maybeSingle();if(error||!data){el('productArea').textContent='This product is unavailable.';return;}product=data;document.title=product.name+' — Shakil Store';const available=Number(product.stock_quantity||0);el('productArea').innerHTML=`<div class="product"><img class="photo" src="${safe(product.image_url||'https://placehold.co/700x700?text=Product')}" alt="${safe(product.name)}"><div><p class="eyebrow">${safe(product.category||'General')}</p><h1>${safe(product.name)}</h1><p class="price">${money(product.price)}</p><p class="muted">${available>0?`In stock: ${available}`:'Currently out of stock'}</p><p style="white-space:pre-wrap;line-height:1.8">${safe(product.description||'No additional description has been provided yet.')}</p><div class="actions"><button class="soft" type="button" ${available<1?'disabled':''} onclick="addToCart(false)">Add to cart</button><button class="primary" type="button" ${available<1?'disabled':''} onclick="addToCart(true)">Buy now</button></div><p id="cartMessage" class="muted" role="status"></p><p class="muted">Payment options: bKash, Nagad, Rocket, or Cash on Delivery. Delivery charge is shown at checkout.</p></div></div>`;await loadReviews();}
function requireAccount(){const returnTo='product.html?id='+productId;location.href='index.html?auth=signup&return='+encodeURIComponent(returnTo);}
async function addToCart(buyNow){const {data:{session}}=await sb.auth.getSession();if(!session){requireAccount();return;}if(!session.user.email_confirmed_at){el('reviewMessage').textContent='Please confirm your email before ordering.';location.href='index.html?auth=login&return='+encodeURIComponent('product.html?id='+productId);return;}let cart={};try{cart=JSON.parse(localStorage.getItem('shakilStoreCart')||'{}')||{};}catch{}if(Number(cart[product.id]||0)+1>Number(product.stock_quantity||0)){alert('Sorry, stock is limited.');return;}cart[product.id]=(Number(cart[product.id])||0)+1;localStorage.setItem('shakilStoreCart',JSON.stringify(cart));if(buyNow){location.href='index.html#checkout';}else{el('cartMessage').textContent='Added to your cart. You can continue browsing or go to checkout.';}}
async function loadReviews(){const {data,error}=await sb.from('product_reviews_public').select('id,rating,review_text,created_at').eq('product_id',productId).order('created_at',{ascending:false});if(error){el('reviews').textContent='Could not load reviews. Apply upgrade-v4.sql first.';el('reviewSummary').textContent='Reviews unavailable.';return;}const list=data||[];el('reviewSummary').textContent=list.length?`${list.length} review(s) · Average rating ${(list.reduce((s,r)=>s+r.rating,0)/list.length).toFixed(1)} / 5`:'No reviews yet. Be the first to review this product.';el('reviews').innerHTML=list.length?list.map(r=>`<article class="review"><div class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)} <span class="muted">${r.rating}/5</span></div><p style="white-space:pre-wrap">${safe(r.review_text)}</p><p class="muted">Customer · ${new Date(r.created_at).toLocaleDateString()}</p></article>`).join(''):'<p class="muted">No customer reviews yet.</p>';myReview=null;if(currentUser){const {data:own}=await sb.from('product_reviews').select('id,rating,review_text').eq('product_id',productId).eq('customer_id',currentUser.id).maybeSingle();myReview=own||null;if(myReview){el('rating').value=String(myReview.rating);el('reviewText').value=myReview.review_text;el('reviewMessage').textContent='Your existing review will be updated.';}}}
sb.auth.onAuthStateChange((_event,session)=>{currentUser=session?.user||null;loadReviews();});el('reviewForm').addEventListener('submit',async ev=>{ev.preventDefault();const {data:{session}}=await sb.auth.getSession();if(!session){el('reviewMessage').textContent='Please sign in first.';location.href='index.html?auth=login&return='+encodeURIComponent('product.html?id='+productId);return;}if(!session.user.email_confirmed_at){el('reviewMessage').textContent='Please confirm your email first.';return;}const rating=Number(el('rating').value),review_text=el('reviewText').value.trim();const {data:existing}=await sb.from('product_reviews').select('id').eq('product_id',productId).eq('customer_id',session.user.id).maybeSingle();const result=existing?await sb.from('product_reviews').update({rating,review_text}).eq('id',existing.id):await sb.from('product_reviews').insert({product_id:productId,customer_id:session.user.id,rating,review_text});if(result.error){el('reviewMessage').textContent='Could not submit review: '+result.error.message;return;}el('reviewMessage').textContent='Review saved.';await loadReviews();});el('year').textContent=new Date().getFullYear();(async()=>{const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;await loadProduct();})();
</script></body></html>
