<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product — Shakil's Choice</title><style>
:root{--green:#126b50;--deep:#103d30;--ink:#17231d;--muted:#68756d;--bg:#f4f8f5;--line:#dfe9e1;--card:#fff;--gold:#d4a936}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;font-weight:800;transition:.18s}button:hover{transform:translateY(-1px)}button:disabled{opacity:.5;cursor:not-allowed;transform:none}.primary{background:var(--green);color:#fff}.soft{background:#e7f2ea;color:var(--green)}a{color:var(--green)}header{position:sticky;top:0;z-index:10;background:#ffffffec;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav,main,footer{max-width:1180px;margin:auto;padding:16px}.nav{display:flex;align-items:center;justify-content:space-between;gap:15px}.logo{display:inline-flex;align-items:center;gap:9px;color:var(--green);font-size:24px;font-weight:900;text-decoration:none}.logo-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff}.navlinks{display:flex;gap:18px;align-items:center}.navlinks a{text-decoration:none;color:var(--ink);font-weight:750;font-size:14px}.crumb{margin:16px 0;color:var(--muted);font-size:14px}.hero-product{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:28px;align-items:stretch}.visual,.details-card,.review-panel{background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 12px 36px #173d250d}.visual{padding:18px;position:relative;overflow:hidden}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:19px;background:#edf3ee;display:block}.visual-badge{position:absolute;left:34px;top:34px;background:#fff;padding:8px 12px;border-radius:999px;font-size:12px;font-weight:850;color:var(--green);box-shadow:0 8px 24px #173d2520}.details-card{padding:clamp(22px,4vw,38px);display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:900;color:var(--green)}h1{font-size:clamp(34px,5vw,58px);line-height:1.02;letter-spacing:-2px;margin:10px 0 16px}.description{font-size:16px;line-height:1.8;color:#52645a;white-space:pre-wrap}.price{font-size:32px;font-weight:950;color:var(--green);margin:18px 0 4px}.stock{font-size:13px;color:var(--muted)}.size-box{margin:20px 0;padding:17px;border:1px solid #dbe6dc;border-radius:18px;background:#f8fbf8}.size-title{font-weight:850;margin:0 0 10px}.size-grid{display:flex;gap:8px;flex-wrap:wrap}.size-option{min-width:50px;background:#fff;border:1px solid #ccd9cf;color:var(--ink)}.size-option.active{background:var(--green);border-color:var(--green);color:#fff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.action-note{min-height:22px;color:var(--muted);font-size:13px;margin:10px 0 0}.payment-note{margin-top:18px;padding:13px 15px;border-radius:14px;background:#f3f7f3;color:#53655b;font-size:13px;line-height:1.6}.review-panel{margin:26px 0;padding:clamp(20px,4vw,34px)}.review-head{display:flex;justify-content:space-between;align-items:end;gap:15px;flex-wrap:wrap}.review-summary{display:flex;align-items:center;gap:12px}.rating-big{font-size:34px;font-weight:950;color:var(--green)}.stars{color:var(--gold);letter-spacing:1px}.review-list{display:grid;gap:12px;margin-top:20px}.review{padding:18px;border:1px solid var(--line);border-radius:17px;background:#fbfdfb}.review-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.review p{line-height:1.7}.form{display:grid;gap:10px;max-width:700px;margin-top:18px}.field{width:100%;padding:13px 14px;border:1px solid #d5e1d7;border-radius:12px;background:#fff;color:var(--ink)}textarea.field{resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{padding:24px;text-align:center;background:#f7faf7;border-radius:16px;color:var(--muted)}footer{color:var(--muted);font-size:13px;padding-bottom:35px}@media(max-width:800px){.hero-product{grid-template-columns:1fr}.photo{aspect-ratio:1/1}.navlinks{gap:10px}.navlinks a{font-size:13px}}@media(max-width:520px){.nav{align-items:flex-start;flex-wrap:wrap}.navlinks{width:100%;justify-content:space-between}.actions,.form-grid{grid-template-columns:1fr}h1{letter-spacing:-1px}.details-card{padding:22px}}
</style></head><body><header><div class="nav"><a class="logo" href="index.html"><span class="logo-mark">S</span> Shakil's Choice</a><nav class="navlinks"><a href="index.html#products">Shop</a><a href="profile.html">My Profile</a><a href="checkout.html">Cart</a></nav></div></header><main><div class="crumb"><a href="index.html#products">← Back to products</a></div><section id="productArea" class="hero-product"><div class="visual">Loading product…</div></section><section class="review-panel"><div class="review-head"><div><span class="eyebrow">REAL CUSTOMER FEEDBACK</span><h2 style="font-size:32px;margin:7px 0">Details & reviews</h2><p id="reviewSummary" class="muted">Loading reviews…</p></div><div id="reviewRating" class="review-summary"></div></div><div id="reviews" class="review-list"></div></section><section class="review-panel"><span class="eyebrow">YOUR EXPERIENCE</span><h2 style="font-size:30px;margin:7px 0">Write a review</h2><p class="muted">Sign in with a confirmed email to share your experience.</p><form id="reviewForm" class="form"><div class="form-grid"><label>Rating<select class="field" id="rating" required><option value="5">★★★★★ — Excellent</option><option value="4">★★★★☆ — Very good</option><option value="3">★★★☆☆ — Good</option><option value="2">★★☆☆☆ — Fair</option><option value="1">★☆☆☆☆ — Poor</option></select></label><div></div></div><label>Your review<textarea class="field" id="reviewText" required minlength="3" maxlength="1500" rows="5" placeholder="Tell other customers what you liked about this product…"></textarea></label><button class="primary" type="submit">Submit review</button><p id="reviewMessage" class="action-note" role="status"></p></form></section></main><footer>© <span id="year"></span> Shakil's Choice · Product details & customer reviews</footer><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const params=new URLSearchParams(location.search),productId=Number(params.get('id'));const sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey);let product=null,currentUser=null,myReview=null,selectedSize='';const el=id=>document.getElementById(id),money=n=>'৳'+Number(n||0).toLocaleString('en-BD');function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function isFashionProduct(p){const c=String(p?.category||'').toLowerCase();return /fashion|clothing|apparel|garment|dress|wear/.test(c);}function selectSize(size){selectedSize=size;document.querySelectorAll('.size-option').forEach(b=>b.classList.toggle('active',b.dataset.size===size));el('sizeMessage').textContent='Selected size: '+size;}function addToCart(buyNow){if(!product)return;if(isFashionProduct(product)&&!selectedSize){el('sizeMessage').textContent='Please select a size first.';return;}let cart={},cartSizes={};try{cart=JSON.parse(localStorage.getItem('shakilStoreCart')||'{}')||{};cartSizes=JSON.parse(localStorage.getItem('shakilStoreCartSizes')||'{}')||{};}catch{}const current=Number(cart[product.id]||0);if(current+1>Number(product.stock_quantity||0)){el('cartMessage').textContent='Sorry, available stock is '+Number(product.stock_quantity||0)+'.';return;}cart[product.id]=current+1;if(isFashionProduct(product))cartSizes[product.id]=selectedSize;localStorage.setItem('shakilStoreCart',JSON.stringify(cart));localStorage.setItem('shakilStoreCartSizes',JSON.stringify(cartSizes));if(buyNow){location.href='checkout.html';return;}el('cartMessage').textContent='Added to cart'+(selectedSize?' · Size '+selectedSize:'')+'. Continue shopping or open Cart to checkout.';}async function loadProduct(){if(!Number.isSafeInteger(productId)||productId<1){el('productArea').innerHTML='<div class="details-card"><h1>Product not found</h1><p class="description">The product link is invalid.</p></div>';return;}const {data,error}=await sb.from('products').select('id,name,category,description,price,image_url,stock_quantity').eq('id',productId).eq('active',true).maybeSingle();if(error||!data){el('productArea').innerHTML='<div class="details-card"><h1>Product unavailable</h1><p class="description">This product is no longer available.</p><a href="index.html#products">Return to shop</a></div>';return;}product=data;document.title=product.name+' — Shakil\'s Choice';const available=Number(product.stock_quantity||0);el('productArea').innerHTML=`<div class="visual"><span class="visual-badge">${safe(product.category||'General')}</span><img class="photo" src="${safe(product.image_url||'https://placehold.co/800x800?text=Product')}" alt="${safe(product.name)}"></div><div class="details-card"><span class="eyebrow">PRODUCT DETAILS</span><h1>${safe(product.name)}</h1><p class="description">${safe(product.description||'No additional description has been provided yet.')}</p><div class="price">${money(product.price)}</div><div class="stock">${available>0?'✓ In stock · '+available+' available':'Currently out of stock'}</div>${isFashionProduct(product)?`<div class="size-box"><p class="size-title">Choose your size <span style="color:#b33">*</span></p><div class="size-grid">${['XS','S','M','L','XL','XXL','XXXL'].map(s=>`<button type="button" class="size-option" data-size="${s}" onclick="selectSize('${s}')">${s}</button>`).join('')}</div><p id="sizeMessage" class="action-note">Select a size before adding to cart.</p></div>`:''}<div class="actions"><button class="soft" type="button" ${available<1?'disabled':''} onclick="addToCart(false)">Add to cart</button><button class="primary" type="button" ${available<1?'disabled':''} onclick="addToCart(true)">Buy now</button></div><p id="cartMessage" class="action-note" role="status"></p><div class="payment-note"><strong>Easy checkout</strong><br>bKash · Nagad · Rocket · Cash on Delivery. You can review your order before submitting.</div></div>`;await loadReviews();if(params.get('buy')==='1'&&available>0&&isFashionProduct(product)){setTimeout(()=>document.querySelector('.size-box')?.scrollIntoView({behavior:'smooth',block:'center'}),180);}}async function loadReviews(){const {data,error}=await sb.from('product_reviews_public').select('id,rating,review_text,created_at').eq('product_id',productId).order('created_at',{ascending:false});if(error){el('reviews').innerHTML='<div class="empty">Reviews are temporarily unavailable.</div>';el('reviewSummary').textContent='Reviews unavailable.';return;}const list=data||[];const avg=list.length?(list.reduce((s,r)=>s+Number(r.rating),0)/list.length):0;el('reviewSummary').textContent=list.length?`${list.length} review(s) · Average rating ${avg.toFixed(1)} / 5`:'No reviews yet. Be the first to review this product.';el('reviewRating').innerHTML=list.length?`<div><div class="rating-big">${avg.toFixed(1)}</div><div class="stars">${'★'.repeat(Math.round(avg))}${'☆'.repeat(5-Math.round(avg))}</div></div>`:'';el('reviews').innerHTML=list.length?list.map(r=>`<article class="review"><div class="review-top"><strong class="stars">${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</strong><span class="muted">${new Date(r.created_at).toLocaleDateString()}</span></div><p style="white-space:pre-wrap">${safe(r.review_text)}</p><span class="muted">Verified customer review</span></article>`).join(''):'<div class="empty">No customer reviews yet.</div>';myReview=null;if(currentUser){const {data:own}=await sb.from('product_reviews').select('id,rating,review_text').eq('product_id',productId).eq('customer_id',currentUser.id).maybeSingle();myReview=own||null;if(myReview){el('rating').value=String(myReview.rating);el('reviewText').value=myReview.review_text;el('reviewMessage').textContent='Your existing review will be updated.';}}}sb.auth.onAuthStateChange((_e,session)=>{currentUser=session?.user||null;loadReviews();});el('reviewForm').addEventListener('submit',async ev=>{ev.preventDefault();const {data:{session}}=await sb.auth.getSession();if(!session){el('reviewMessage').textContent='Please sign in first.';location.href='index.html?auth=login&return='+encodeURIComponent('product.html?id='+productId);return;}if(!session.user.email_confirmed_at){el('reviewMessage').textContent='Please confirm your email first.';return;}const rating=Number(el('rating').value),review_text=el('reviewText').value.trim();const {data:existing}=await sb.from('product_reviews').select('id').eq('product_id',productId).eq('customer_id',session.user.id).maybeSingle();const result=existing?await sb.from('product_reviews').update({rating,review_text}).eq('id',existing.id):await sb.from('product_reviews').insert({product_id:productId,customer_id:session.user.id,rating,review_text});if(result.error){el('reviewMessage').textContent='Could not submit review: '+result.error.message;return;}el('reviewMessage').textContent='Review saved successfully.';await loadReviews();});el('year').textContent=new Date().getFullYear();(async()=>{const {data}=await sb.auth.getSession();currentUser=data.session?.user||null;await loadProduct();})();
</script></body></html>
