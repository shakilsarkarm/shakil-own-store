<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My account — Shakil Store</title><style>body{margin:0;background:#f5f8f5;color:#17231d;font-family:Arial,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}header,.panel{background:white;border:1px solid #e0e9e1;border-radius:18px;padding:20px;margin:16px 0}.logo{font-size:23px;font-weight:900;color:#126b50;text-decoration:none}button{border:0;border-radius:10px;padding:12px 16px;font-weight:bold;cursor:pointer}.primary{background:#126b50;color:white}.soft{background:#e8f2eb;color:#126b50}.field{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e3da;border-radius:10px}.muted{color:#68756d;line-height:1.6}.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;background:#e8f2eb;border:3px solid #e0e9e1}.form{display:grid;gap:12px;max-width:560px}</style></head><body><div class="wrap"><header><a class="logo" href="index.html">Shakil Store</a> · <a href="index.html#checkout">Back to store</a></header><section class="panel"><h1>My account</h1><p class="muted">Update your name, phone number and profile picture.</p><p id="status" class="muted">Checking sign-in…</p><div id="profile" style="display:none"><img id="avatar" class="avatar" alt="Profile picture"><form id="form" class="form"><label>Profile picture</label><input id="photo" class="field" type="file" accept="image/png,image/jpeg,image/webp"><label>Full name</label><input id="name" class="field" required minlength="2" maxlength="100"><label>Phone number</label><input id="phone" class="field" required minlength="7" maxlength="20"><label>Email address</label><input id="email" class="field" disabled><button class="primary" type="submit">Save profile</button><button class="soft" type="button" onclick="signOut()">Sign out</button></form></div></section></div><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey),el=id=>document.getElementById(id);let user=null;function defaultAvatar(){return 'https://placehold.co/240x240?text=Profile';}async function init(){const {data:{session}}=await sb.auth.getSession();user=session?.user;if(!user){el('status').textContent='Please sign in to view your account.';setTimeout(()=>location.href='index.html?auth=login&return='+encodeURIComponent('profile.html'),800);return;}el('profile').style.display='block';el('status').textContent='Signed in.';el('email').value=user.email||'';el('name').value=user.user_metadata?.full_name||'';el('phone').value=user.user_metadata?.phone||'';el('avatar').src=user.user_metadata?.avatar_url||defaultAvatar();}
el('form').addEventListener('submit',async ev=>{ev.preventDefault();el('status').textContent='Saving…';let avatarUrl=user.user_metadata?.avatar_url||'';const file=el('photo').files[0];if(file){if(file.size>3*1024*1024){el('status').textContent='Image must be 3 MB or smaller.';return;}const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path=user.id+'/'+Date.now()+'.'+ext;const {error:uploadError}=await sb.storage.from('profile-photos').upload(path,file,{upsert:true,contentType:file.type});if(uploadError){el('status').textContent='Photo upload failed. Run the storage section in upgrade-v4.sql: '+uploadError.message;return;}const {data}=sb.storage.from('profile-photos').getPublicUrl(path);avatarUrl=data.publicUrl;}const {data,error}=await sb.auth.updateUser({data:{full_name:el('name').value.trim(),phone:el('phone').value.trim(),avatar_url:avatarUrl}});if(error){el('status').textContent='Could not save profile: '+error.message;return;}user=data.user;el('avatar').src=avatarUrl||defaultAvatar();el('status').textContent='Profile saved successfully.';});async function signOut(){await sb.auth.signOut();location.href='index.html';}init();
</script></body></html>
