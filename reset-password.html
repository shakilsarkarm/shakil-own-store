<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset password — Shakil Store</title><style>body{margin:0;background:#f5f8f5;font-family:Arial,sans-serif;color:#17231d}.box{max-width:520px;margin:8vh auto;padding:24px;background:white;border:1px solid #e0e9e1;border-radius:18px}.field{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8e3da;border-radius:10px;margin:8px 0 14px}button{padding:12px 16px;border:0;border-radius:10px;background:#126b50;color:white;font-weight:bold;cursor:pointer}.muted{color:#68756d;line-height:1.6}</style></head><body><main class="box"><h1>Choose a new password</h1><p class="muted">Open this page from the password-reset email, then enter and confirm your new password.</p><form id="form"><label>New password (minimum 8 characters)</label><input id="password" class="field" type="password" minlength="8" required autocomplete="new-password"><label>Repeat new password</label><input id="repeat" class="field" type="password" minlength="8" required autocomplete="new-password"><button type="submit">Update password</button></form><p id="msg" class="muted" role="status"></p><p><a href="index.html">Return to Shakil Store</a></p></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient(CONFIG.supabaseUrl,CONFIG.supabaseAnonKey),el=id=>document.getElementById(id);sb.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')el('msg').textContent='Reset link verified. Enter your new password.';});el('form').addEventListener('submit',async e=>{e.preventDefault();if(el('password').value!==el('repeat').value){el('msg').textContent='Passwords do not match.';return;}el('msg').textContent='Updating password…';const {error}=await sb.auth.updateUser({password:el('password').value});el('msg').textContent=error?'Could not update password: '+error.message:'Password updated successfully. You can now sign in.';if(!error){el('form').reset();setTimeout(()=>location.href='index.html?auth=login',1200);}});</script></body></html>
